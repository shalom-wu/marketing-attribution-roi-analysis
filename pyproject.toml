[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-attribution-roi-analysis"
version = "0.1.0"
description = "Marketing channel attribution and budget ROI strategy analysis."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Shalom Wu" }]
license = { file = "LICENSE" }
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "seaborn>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
